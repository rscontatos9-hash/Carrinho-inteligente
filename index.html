<!DOCTYPE html>
<html lang="pt-br">
<head>
  <script>
  (function() {
    // Função que abre URL no navegador do sistema
    function abrirExterno(url) {
      // Tenta abrir com _system (funciona na maioria dos WebViews do Kodular)
      window.open(url, '_system');
      // Fallback: se o _system não funcionar, tenta via Intent (Android)
      setTimeout(function() {
        window.location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=http;package=com.android.chrome;end';
      }, 100);
    }

    // Captura todos os cliques no documento
    document.addEventListener('click', function(e) {
      // Encontra o elemento <a> mais próximo do clique
      let link = e.target.closest('a');
      if (link && link.href) {
        e.preventDefault();  // Impede o carregamento dentro da WebView
        abrirExterno(link.href);
      }
    });
  })();
</script>  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho Inteligente</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">

<style>
:root {
    --primary: linear-gradient(90deg, #7d5fff, #6c5ce7);
    --bg-body: #f0f2f5;
    --text-placeholder: rgba(0, 0, 0, 0.3);
    --border-color: #edeff2;
    --success: #2ed573;
    --warning: #ffa502;
    --danger: #ff4757;
}

@keyframes pulsar {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

body {
    font-family: 'Segoe UI', sans-serif;
    background-color: var(--bg-body);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding-top: 20px;
}

.app-title {
    font-family: 'Montserrat', sans-serif;
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 15px;
    background: var(--primary);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.container {
    background: white;
    padding: 30px;
    width: 90%;
    max-width: 380px;
    border-radius: 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.08);
}

.input-wrapper {
    display: flex;
    border: 2px solid var(--border-color);
    border-radius: 15px;
    padding: 12px 18px;
    margin-bottom: 20px;
}

input {
    border: none;
    outline: none;
    width: 100%;
    font-size: 16px;
    background: transparent;
}

.qty-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f8f9fa;
    border-radius: 15px;
    padding: 10px;
    margin-bottom: 25px;
}

.btn-qty {
    background: #7d5fff;
    color: white;
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    font-size: 20px;
    cursor: pointer;
}

.main-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 15px;
    background: var(--primary);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 12px;
}

.btn-limpar {
    width: 100%;
    padding: 12px;
    border-radius: 15px;
    border: 2px solid var(--border-color);
    background: transparent;
    color: #888;
    cursor: pointer;
}

#lista-itens { max-height: 150px; overflow-y: auto; }

.item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
}

.btn-delete {
    background: var(--danger);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 4px 8px;
    cursor: pointer;
}

.footer-status { padding-top: 20px; }

.barra-fundo {
    background: #eee;
    height: 12px;
    border-radius: 20px;
    overflow: hidden;
}

#barra {
    height: 100%;
    width: 0%;
    background: var(--success);
    transition: 0.3s;
}

#status-texto {
    text-align: center;
    font-weight: 700;
}
</style>
</head>

<body>

<h1 class="app-title">🛒 Carrinho Inteligente</h1>

<div class="container">
    <div class="input-wrapper">
        <input type="number" id="orcamento" placeholder="R$ Digite aqui o Valor a Ser Gasto">
    </div>

    <div class="qty-container">
        <button class="btn-qty" onclick="mudarQty(-1)">-</button>
        <span id="quantidade-display">1</span>
        <button class="btn-qty" onclick="mudarQty(1)">+</button>
    </div>

    <div class="input-wrapper">
        <input type="number" id="valor_prod" placeholder="R$ Valor do Produto">
    </div>

    <button class="main-btn" onclick="adicionar()">ADICIONAR ITEM</button>
    <button class="btn-limpar" onclick="limparTudo()">Limpar Lista</button>

    <div id="lista-itens"></div>

    <div class="footer-status">
        <div class="barra-fundo">
            <div id="barra"></div>
        </div>
        <div id="status-texto">Aguardando orçamento...</div>
    </div>
</div>

<!-- SOM DE SIRENE -->
<audio id="sirene" src="https://actions.google.com/sounds/v1/alarms/siren.ogg"></audio>

<script>
let totalGasto = 0;
let qtdAtual = 1;
let alertaAtivo = false;

function mudarQty(val) {
    qtdAtual += val;
    if (qtdAtual < 1) qtdAtual = 1;
    document.getElementById("quantidade-display").innerText = qtdAtual;
}

function adicionar() {
    const orcamentoTotal = parseFloat(document.getElementById("orcamento").value);
    const valorUnitario = parseFloat(document.getElementById("valor_prod").value);

    if (!orcamentoTotal || !valorUnitario) {
        alert("Preencha os valores!");
        return;
    }

    const subtotal = valorUnitario * qtdAtual;
    totalGasto += subtotal;

    const lista = document.getElementById("lista-itens");
    const itemDiv = document.createElement("div");
    itemDiv.className = "item-row";

    itemDiv.innerHTML = `
        <span>${qtdAtual}x Produto</span>
        <span>R$ ${subtotal.toFixed(2)}</span>
        <button class="btn-delete" onclick="removerItem(this, ${subtotal})">🗑️</button>
    `;

    lista.prepend(itemDiv);

    atualizarBarra(orcamentoTotal);

    document.getElementById("valor_prod").value = "";
    qtdAtual = 1;
    document.getElementById("quantidade-display").innerText = "1";
}

function removerItem(botao, valor) {
    if (!confirm("Deseja remover este item? 🧐")) return;

    const orcamentoTotal = parseFloat(document.getElementById("orcamento").value);
    totalGasto -= valor;
    botao.parentElement.remove();
    atualizarBarra(orcamentoTotal);
}

function atualizarBarra(orcamentoTotal) {
    const porcentagem = (totalGasto / orcamentoTotal) * 100;
    const barra = document.getElementById("barra");
    const statusTxt = document.getElementById("status-texto");
    const sirene = document.getElementById("sirene");

    barra.style.width = Math.min(porcentagem, 100) + "%";

    if (porcentagem > 100) {
        barra.style.background = "var(--danger)";
        barra.style.animation = "pulsar 0.6s infinite";

        if (!alertaAtivo) {
            alertaAtivo = true;
            sirene.currentTime = 0;
            sirene.play();

            setTimeout(() => {
                sirene.pause();
                alertaAtivo = false;
            }, 6000);
        }

    } else {
        barra.style.background = "var(--success)";
        barra.style.animation = "none";
        sirene.pause();
        alertaAtivo = false;
    }

    const restante = orcamentoTotal - totalGasto;

    statusTxt.innerText = restante < 0
        ? `ESTOUROU: R$ ${Math.abs(restante).toFixed(2)}`
        : `Resta: R$ ${restante.toFixed(2)}`;
}

function limparTudo() {
    if (confirm("Limpar tudo?")) {
        totalGasto = 0;
        document.getElementById("lista-itens").innerHTML = "";
        document.getElementById("barra").style.width = "0%";
        document.getElementById("barra").style.background = "var(--success)";
        document.getElementById("barra").style.animation = "none";
        document.getElementById("status-texto").innerText = "Aguardando orçamento...";
        document.getElementById("sirene").pause();
        alertaAtivo = false;
    }
}
</script>

</body>
</html>
